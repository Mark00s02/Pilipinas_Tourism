<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model preview</title>
<style>
  body{margin:0;background:#1b2426;color:#e6ebe2;font:12px/1.4 system-ui,sans-serif}
  #labels{position:fixed;inset:0;pointer-events:none}
  #labels span{position:absolute;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:2px 6px;border-radius:3px}
</style>
</head>
<body>
<!-- Dev tool: every downloaded model on one grid, each scaled to 2 units tall, red arrow = +z (the "forward" the builders assume). -->
<canvas id="c"></canvas><div id="labels"></div>
<script src="../assets/three.min.js"></script>
<script src="../assets/js/vendor/GLTFLoader.js"></script>
<script src="../assets/js/model-credits.js"></script>
<script>
// models.js loads assets/models/... relative to the page; this page lives in tools/, so point it one level up.
const realCreate = document.createElement.bind(document);
document.createElement = tag => { const el = realCreate(tag); if (tag === 'script') { const set = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src').set; Object.defineProperty(el, 'src', { set(v) { set.call(el, v.startsWith('assets/') ? '../' + v : v); } }); } return el; };
</script>
<script src="../assets/js/models.js"></script>
<script>
const names = Object.keys(window.PH_MODEL_CREDITS);
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setSize(innerWidth, innerHeight); r.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#1b2426');
scene.add(new THREE.HemisphereLight(0xffffff, 0x445544, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, .9); sun.position.set(3, 6, 4); scene.add(sun);
const cols = 6, cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, .1, 200);
cam.position.set(cols * 1.5, 9, 22); cam.lookAt(cols * 1.5 - 1.5, 0, 3.5);
PH.loadModels(names).then(() => {
  names.forEach((n, i) => {
    const x = (i % cols) * 3, z = Math.floor(i / cols) * 3.6;
    const m = PH.modelClone(n, { height: 2 }); m.position.set(x, 0, z); scene.add(m);
    scene.add(new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(x, .02, z), 1.2, 0xff3030));
    const g = new THREE.Mesh(new THREE.CircleGeometry(1.3, 24).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x2c3a3c })); g.position.set(x, 0, z); scene.add(g);
  });
  r.render(scene, cam);
  names.forEach((n, i) => {
    const p = new THREE.Vector3((i % cols) * 3, -.25, Math.floor(i / cols) * 3.6 + 1.3).project(cam);
    const s = document.createElement('span'); s.textContent = n;
    s.style.left = `${(p.x + 1) / 2 * innerWidth}px`; s.style.top = `${(1 - p.y) / 2 * innerHeight}px`;
    document.getElementById('labels').appendChild(s);
  });
  document.body.dataset.done = '1';
}).catch(e => { document.body.textContent = 'ERROR ' + e; document.body.dataset.done = '1'; });
</script>
</body>
</html>
